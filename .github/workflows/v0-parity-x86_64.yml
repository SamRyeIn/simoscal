# The V0 gate's last leg: does the Chaquopy engine compute the same bytes on
# x86_64 as it does on arm64 and on the desktop?
#
# This lives in CI rather than on a developer machine for a concrete reason: the
# Apple-silicon Android emulator ships qemu-system-aarch64 and qemu-system-armel
# and no x86_64 backend, so an x86_64 system image has nothing to boot on there
# no matter what is installed. A Linux x86_64 runner is the cheapest real host.
#
# Manual trigger only. It boots an emulator and builds a Chaquopy APK, so it is
# neither fast nor free on a private repo, and nothing about it needs to run per
# push — the answer only changes when the engine or its pinned runtime changes.
name: V0 parity — x86_64

on:
  workflow_dispatch:

  # Temporary, and scoped twice over. GitHub only offers `workflow_dispatch` for
  # workflows that exist on the *default* branch, so until this lands on `main`
  # there is no way to trigger it by hand. The path filter keeps it from firing
  # on commits that cannot change the answer. Delete this block once the branch
  # merges and manual dispatch becomes available.
  push:
    branches:
      - feat/quickedit-v1
    paths:
      - '.github/workflows/v0-parity-x86_64.yml'
      - 'android/engine/**'
      - 'android/parity/**'
      - 'simoscal/**'
      - 'pyproject.toml'

jobs:
  x86_64-parity:
    name: x86_64 emulator vs host
    runs-on: ubuntu-latest
    timeout-minutes: 90

    steps:
      - uses: actions/checkout@v4

      # Without this the emulator falls back to software rendering and a boot
      # that normally takes ~2 minutes takes longer than the job timeout.
      - name: Enable KVM group perms
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' \
            | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      # Must be 3.13: it is both the host half of the comparison and Chaquopy's
      # buildPython. run_host_parity.py refuses any other minor version rather
      # than producing a golden that would fail the gate for the wrong reason.
      - name: Set up Python 3.13
        uses: actions/setup-python@v5
        with:
          python-version: '3.13'

      - name: Install simoscal
        run: |
          python -m pip install --upgrade pip
          pip install .

      # Generated fresh from this checkout rather than read from the committed
      # golden, so the comparison is against the code under test and a stale
      # golden cannot pass a run it never described.
      - name: Host half of the comparison
        run: |
          python android/parity/run_host_parity.py --out "$RUNNER_TEMP/host_golden_ci.json"
          python - <<'PY'
          import json, os, sys
          r = json.load(open(os.environ["RUNNER_TEMP"] + "/host_golden_ci.json"))
          steps = r["compared"]["steps"]
          skipped = {k: v for k, v in steps.items() if isinstance(v, dict) and "skipped" in v}
          print("host digest:", r["digest"])
          print("legs:", ", ".join(sorted(steps)))
          if skipped:
              sys.exit(f"host half skipped {sorted(skipped)} — fixtures missing from the checkout")
          PY

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3

      - name: Device half on an x86_64 emulator, then compare
        uses: reactivecircus/android-emulator-runner@v2
        env:
          # Chaquopy's default buildPython is a Homebrew path that exists only on
          # Sam's Mac; point it at this runner's 3.13.
          SIMOSCAL_BUILD_PYTHON: python
        with:
          api-level: 35
          target: google_apis
          arch: x86_64
          profile: pixel_6
          ram-size: 4096M
          disk-size: 8G
          force-avd-creation: false
          emulator-options: -no-window -gpu swiftshader_indirect -noaudio -no-boot-anim -camera-back none
          disable-animations: true
          working-directory: android
          script: |
            set -euo pipefail

            # `connectedDebugAndroidTest` reports tests=0 and fails the build
            # here regardless of the run, so the APKs are installed and the
            # runner is invoked directly.
            ./gradlew --no-daemon :engine:installDebug :engine:installDebugAndroidTest

            bash parity/push_fixtures_and_compare.sh push

            adb shell am instrument -w \
              -e fixtureDir /data/local/tmp/v0 \
              com.simoscal.engine.test/androidx.test.runner.AndroidJUnitRunner \
              2>&1 | tee "$RUNNER_TEMP/instrument.log"

            # `am instrument` exits 0 even when the test fails, so the log is the
            # only signal that the run was real.
            grep -q "OK (" "$RUNNER_TEMP/instrument.log" \
              || { echo "instrumentation did not report OK"; exit 1; }

            # OUT keeps this off the committed arm64 record; PY313 points the
            # helper at the runner's interpreter instead of a local .venv313.
            OUT="$RUNNER_TEMP/v0_device_report_x86_64.json" \
            PY313=python \
              bash parity/push_fixtures_and_compare.sh compare

      - name: Publish the evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: v0-parity-x86_64
          path: |
            ${{ runner.temp }}/host_golden_ci.json
            ${{ runner.temp }}/v0_device_report_x86_64.json
            ${{ runner.temp }}/instrument.log
          if-no-files-found: warn
