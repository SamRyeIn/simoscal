org.gradle.jvmargs=-Xmx4g -Dfile.encoding=UTF-8
# Parallel execution and the build cache are OFF because Chaquopy 17.0.0's tasks
# have undeclared input/output edges (installPythonRequirements reads outputs of
# mergePythonSources and the asset pipeline without declaring the dependency).
# With caching/parallelism ON, Gradle escalates those edges from a warning to a
# hard build failure ("execution optimizations disabled … uses this output of …
# without declaring a dependency"). Off, the same edges are tolerated. This is a
# single-user V0 gate on one machine, so losing cache/parallel speed is a
# non-issue; correctness of the parity result is what matters.
org.gradle.parallel=false
org.gradle.caching=false

android.useAndroidX=true
android.nonTransitiveRClass=true

kotlin.code.style=official
