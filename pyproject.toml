[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "simoscal"
version = "0.1.0"
description = "Parse, read, edit, and minimal-diff write Simos18 (SC8S50) TunerPro XDF/BIN calibrations in physical units."
requires-python = ">=3.11"
license = { text = "Proprietary" }
authors = [{ name = "Sam Ryan", email = "samryan1021@gmail.com" }]
dependencies = [
    "numpy>=1.24",
]

[project.optional-dependencies]
plot = ["matplotlib>=3.7"]
export = ["openpyxl>=3.1"]
desktop = ["matplotlib>=3.7", "openpyxl>=3.1"]
dev = ["pytest>=7.4", "matplotlib>=3.7", "openpyxl>=3.1"]

[tool.setuptools]
packages = [
    "simoscal",
    "simoscal.analysis",
    "simoscal.tune",
    "simoscal.tune.domains",
    "simoscal.tune.profiles",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
markers = [
    "tunerpro: parity test gated on a captured tunerpro_oracle.json (skipped by default on Mac)",
]
