[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "simoscal"
version = "0.1.0"
description = "Parse, read, edit, and minimal-diff write Simos18 (SC8S50) TunerPro XDF/BIN calibrations in physical units."
requires-python = ">=3.11"
license = { text = "Proprietary" }
authors = [{ name = "Sam Ryan", email = "samryan1021@gmail.com" }]
dependencies = [
    "numpy>=1.24",
]

[project.optional-dependencies]
plot = ["matplotlib>=3.7"]
export = ["openpyxl>=3.1"]
desktop = ["matplotlib>=3.7", "openpyxl>=3.1"]
dev = ["pytest>=7.4", "pytest-xdist>=3.5", "matplotlib>=3.7", "openpyxl>=3.1"]

[tool.setuptools]
packages = [
    "simoscal",
    "simoscal.advice",
    "simoscal.analysis",
    "simoscal.tune",
    "simoscal.tune.domains",
    "simoscal.tune.profiles",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
# The suite is CPU-bound and embarrassingly parallel: every test that touches the
# filesystem writes under `tmp_path`, and the shared fixtures (the real XDF, the
# real bin, the historical output bins) are read-only, so workers cannot collide.
# Serially it runs ~15 min; on 8 workers, ~2 min. Pass `-n0` to run in one process
# when debugging a single test — parallel output interleaves and hides live stdout.
addopts = ["-n", "auto"]
markers = [
    "tunerpro: parity test gated on a captured tunerpro_oracle.json (skipped by default on Mac)",
]
